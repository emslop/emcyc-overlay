name: Check fancy-mumble update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fancy-mumble-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot
          fetch-depth: 0

      - name: Check latest Fancy Mumble release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # /releases/latest excludes prereleases. Select the most recently
          # published non-draft release, including alpha/beta/rc releases.
          tag=$(gh api --paginate --slurp \
            'repos/Fancy-Mumble/FancyMumble/releases?per_page=100' \
            | jq -er '[.[][] | select(.draft == false)]
              | max_by(.published_at) | .tag_name')
          version=$(printf '%s' "${tag#v}" | sed -E 's/-(alpha|beta|rc)\./_\1/')
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*(_(alpha|beta|rc)[0-9]+)?$ ]]; then
            echo "::error::Unsupported Fancy Mumble tag: $tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Detect current versioned ebuild
        id: current
        shell: bash
        run: |
          set -euo pipefail
          file=$(find net-voip/fancy-mumble -maxdepth 1 \
            -name 'fancy-mumble-*.ebuild' ! -name 'fancy-mumble-9999.ebuild' \
            | sort -V | tail -1)
          [[ -n "$file" ]] || { echo "::error::No versioned ebuild found"; exit 1; }
          version=${file##*/fancy-mumble-}
          version=${version%.ebuild}
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rename ebuild and commit bump to bot branch
        if: steps.release.outputs.version != steps.current.outputs.version
        env:
          CURRENT_FILE: ${{ steps.current.outputs.file }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git mv "$CURRENT_FILE" "net-voip/fancy-mumble/fancy-mumble-${VERSION}.ebuild"
          git commit -m "net-voip/fancy-mumble: bump to ${VERSION}"
          git pull --rebase origin bot
          git push origin HEAD:bot

      # Also repair missing/stale manifests when the version is unchanged.
      - name: Trigger Gentoo manifest workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/update-fancy-mumble.yml/dispatches" \
            -f ref=bot
