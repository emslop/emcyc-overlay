name: Update aurelia-tui manifest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/emslop/gentoo-ci:latest
    steps:
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4
        with:
          ref: bot

      - name: Detect newest ebuilds
        id: ebuild
        shell: bash
        run: |
          file=$(find games-util/aurelia-tui -maxdepth 1 \
            -name 'aurelia-tui-*.ebuild' | sort -V | tail -1)
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Generate Manifests and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          export DISTDIR="$(mktemp -d)"

          ebuild "${{ steps.ebuild.outputs.file }}" manifest

          for m in games-util/aurelia-tui/Manifest; do
            if [[ ! -s "$m" ]]; then
              echo "::error::$m is empty after regeneration"
              exit 1
            fi
          done

          if git diff --quiet -- \
            games-util/aurelia-tui/Manifest; then
            echo "Manifests are already up to date"
            exit 0
          fi

          git add games-util/aurelia-tui/Manifest
          git commit -m "games-util/aurelia-tui: regenerate Manifests"
          git push origin bot
