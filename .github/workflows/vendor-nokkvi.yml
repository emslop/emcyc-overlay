name: Vendor nokkvi

on:
  workflow_dispatch:
    inputs:
      version:
        description: nokkvi version (as in Cargo.toml)
        required: true
        default: "0.28.1"
      commit:
        description: nokkvi upstream commit or tag to vendor
        required: true
        default: c7e34b3f61a14f6c9f78d72bed4f2546b3435096

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nokkvi
        uses: actions/checkout@v4
        with:
          repository: f-o-o-g-s/nokkvi
          ref: ${{ inputs.commit }}
          path: nokkvi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Vendor dependencies
        working-directory: nokkvi
        run: |
          cargo vendor --locked vendor > vendor-config.toml
          tar --owner=0 --group=0 --sort=name -cJf "$GITHUB_WORKSPACE/nokkvi-${{ inputs.version }}-vendor.tar.xz" vendor vendor-config.toml

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: nokkvi-${{ inputs.version }}-vendor
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Vendored dependencies for media-sound/nokkvi-${{ inputs.version }}"
          gh release upload "$TAG" "nokkvi-${{ inputs.version }}-vendor.tar.xz" --repo "$GITHUB_REPOSITORY" --clobber
