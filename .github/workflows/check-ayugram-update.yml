name: Check ayugram-desktop update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot

      - name: Check latest AyuGram release
        id: release
        run: |
          latest=$(curl -fsSL \
            https://api.github.com/repos/AyuGram/AyuGramDesktop/releases/latest \
            | jq -r '.tag_name | ltrimstr("v")')
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Detect current ebuild version
        id: current
        run: |
          file=$(find net-im/ayugram-desktop -maxdepth 1 \
            -name 'ayugram-desktop-*.ebuild' | sort -V | tail -1)
          version=$(basename "$file" .ebuild | sed 's/.*-//')
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rename ebuild and commit bump to bot branch
        if: steps.release.outputs.version != steps.current.outputs.version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B bot origin/bot

          git mv "${{ steps.current.outputs.file }}" \
            "net-im/ayugram-desktop/ayugram-desktop-${{ steps.release.outputs.version }}.ebuild"
          git commit -m "net-im/ayugram-desktop: bump to ${{ steps.release.outputs.version }}"
          git push origin bot

      - name: Trigger Gentoo manifest workflow
        if: steps.release.outputs.version != steps.current.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/workflows/update-ayugram.yml/dispatches \
            -f ref=bot
