name: Update proton-cachyos manifest

on:
  repository_dispatch:
    types: [proton-cachyos-update]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proton-cachyos-update
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/emslop/gentoo-ci:latest
    steps:
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4
        with:
          ref: bot
          fetch-depth: 0

      - name: Detect newest versioned ebuild
        id: ebuild
        shell: bash
        run: |
          set -euo pipefail
          file=$(find games-util/proton-cachyos -maxdepth 1 \
            -name 'proton-cachyos-*.ebuild' ! -name 'proton-cachyos-9999.ebuild' \
            | sort -V | tail -1)
          [[ -n "$file" ]] || { echo "::error::No versioned ebuild found"; exit 1; }
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Generate Manifest and commit
        env:
          EBUILD_FILE: ${{ steps.ebuild.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          export DISTDIR
          DISTDIR=$(mktemp -d)
          trap 'rm -rf "$DISTDIR"' EXIT
          ebuild "$EBUILD_FILE" manifest

          manifest="games-util/proton-cachyos/Manifest"
          if [[ ! -s "$manifest" ]]; then
            echo "::error::$manifest is empty after regeneration"
            exit 1
          fi

          # Stage first: git diff alone misses a newly created Manifest.
          git add -- "$manifest"
          if git diff --cached --quiet -- "$manifest"; then
            echo "Manifest is already up to date"
            exit 0
          fi

          git commit -m "games-util/proton-cachyos: regenerate Manifest"
          git pull --rebase origin bot
          git push origin HEAD:bot
