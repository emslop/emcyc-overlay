name: Update ayugram-desktop

on:
  repository_dispatch:
    types: [ayugram-update]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: gentoo/stage3:latest
    steps:
      - name: Prepare Git and jq
        run: |
          emerge-webrsync
          emerge --quiet --usepkg --getbinpkg dev-vcs/git app-misc/jq
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve target version
        id: release
        shell: bash
        run: |
          if [[ -n "${{ github.event.client_payload.version }}" ]]; then
            version="${{ github.event.client_payload.version }}"
          else
            version=$(curl -fsSL \
              https://api.github.com/repos/AyuGram/AyuGramDesktop/releases/latest \
              | jq -r '.tag_name | ltrimstr("v")')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Bump ebuild, generate Manifest, and commit directly
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          new_ebuild="net-im/ayugram-desktop/ayugram-desktop-${{ steps.release.outputs.version }}.ebuild"
          git mv "${{ steps.current.outputs.file }}" "$new_ebuild"
          ebuild "$new_ebuild" manifest
          git add net-im/ayugram-desktop/Manifest
          git commit -m "net-im/ayugram-desktop: bump to ${{ steps.release.outputs.version }}"
          git push origin HEAD:main
