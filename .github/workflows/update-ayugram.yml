name: Update ayugram-desktop manifest

on:
  repository_dispatch:
    types: [ayugram-update]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    container:
      image: gentoo/stage3:latest
    steps:
      - name: Prepare Git and jq
        run: |
          emerge-webrsync
          emerge --quiet --usepkg --getbinpkg dev-vcs/git app-misc/jq
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Detect newest ebuild
        id: ebuild
        shell: bash
        run: |
          file=$(find net-im/ayugram-desktop -maxdepth 1 \
            -name 'ayugram-desktop-*.ebuild' | sort -V | tail -1)
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Generate Manifest and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ebuild "${{ steps.ebuild.outputs.file }}" manifest
          if git diff --quiet -- net-im/ayugram-desktop/Manifest; then
            echo "Manifest is already up to date"
            exit 0
          fi
          git add net-im/ayugram-desktop/Manifest
          git commit -m "net-im/ayugram-desktop: regenerate Manifest"
          git push origin HEAD:main
