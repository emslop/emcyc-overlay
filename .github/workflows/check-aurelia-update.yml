name: Check aurelia update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest Aurelia release
        id: release
        run: |
          latest=$(curl -fsSL \
            https://api.github.com/repos/Drackrath/Aurelia/releases/latest \
            | jq -r '.tag_name | ltrimstr("v")')
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Detect current ebuild version
        id: current
        run: |
          file=$(find games-util/aurelia -maxdepth 1 \
            -name 'aurelia-*.ebuild' | sort -V | tail -1)
          version=$(basename "$file" .ebuild | sed 's/.*-//')
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rename ebuild and commit bump to bot branch
        if: steps.release.outputs.version != steps.current.outputs.version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Base the update branch on the latest bot branch when it exists,
          # otherwise start from the current default branch checkout.
          if git fetch origin bot; then
            git checkout -B bot origin/bot
          else
            git checkout -B bot
          fi

          git mv "${{ steps.current.outputs.file }}" \
            "games-util/aurelia/aurelia-${{ steps.release.outputs.version }}.ebuild"
          git commit -m "games-util/aurelia: bump to ${{ steps.release.outputs.version }}"
          git push origin bot

      - name: Trigger Gentoo manifest workflow
        if: steps.release.outputs.version != steps.current.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type=aurelia-update \
            -f 'client_payload[version]=${{ steps.release.outputs.version }}'
