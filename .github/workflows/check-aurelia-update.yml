name: Check aurelia update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot

      - name: Check latest Aurelia release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          latest=$(curl -fsSL \
            https://api.github.com/repos/Drackrath/Aurelia/releases/latest \
            | jq -er '.tag_name | strings | select(length > 0) | ltrimstr("v")')
          if [[ ! $latest =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Missing or unsupported Aurelia release version"
            exit 1
          fi
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Detect current ebuild and compare versions
        id: current
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check-update-version.py \
            games-util/aurelia aurelia "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename ebuild and commit bump to bot branch
        if: steps.current.outputs.newer == 'true'
        env:
          CURRENT_FILE: ${{ steps.current.outputs.file }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B bot origin/bot

          target="games-util/aurelia/aurelia-${LATEST_VERSION}.ebuild"
          [[ ! -e $target ]] || { echo "::error::Target ebuild already exists"; exit 1; }
          git mv -- "$CURRENT_FILE" "$target"
          git commit -m "games-util/aurelia: bump to ${LATEST_VERSION}"
          git push origin bot

      - name: Trigger Gentoo manifest workflow
        if: steps.current.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/workflows/update-aurelia.yml/dispatches \
            -f ref=bot
