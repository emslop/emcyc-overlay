name: Check mint update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mint-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot
          fetch-depth: 0

      - name: Check latest Mint release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(gh api repos/ziord/mint/releases/latest \
            | jq -er '.tag_name | ltrimstr("v") | select(test("^[0-9]+(\\.[0-9]+)+$"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Detect current ebuild and compare versions
        id: current
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check-update-version.py \
            dev-zig/mint mint "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename ebuild and commit bump to bot branch
        if: steps.current.outputs.newer == 'true'
        env:
          CURRENT_FILE: ${{ steps.current.outputs.file }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          target="dev-zig/mint/mint-${VERSION}.ebuild"
          [[ ! -e $target ]] || { echo "::error::Target ebuild already exists"; exit 1; }
          git mv -- "$CURRENT_FILE" "$target"
          git commit -m "dev-zig/mint: bump to ${VERSION}"
          git pull --rebase origin bot
          git push origin HEAD:bot

      # Also repair missing/stale manifests when the version is unchanged.
      - name: Trigger Gentoo manifest workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/update-mint.yml/dispatches" \
            -f ref=bot
