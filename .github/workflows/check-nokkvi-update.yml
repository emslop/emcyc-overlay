name: Check nokkvi update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot

      - name: Check latest nokkvi release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh api repos/f-o-o-g-s/nokkvi/releases/latest --jq '.tag_name')
          version=${tag#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$tag" == "v${version}" ]]
          commit=$(gh api "repos/f-o-o-g-s/nokkvi/commits/$tag" --jq '.sha')
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate dependency-aware ebuild
        id: bump
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/update-nokkvi.py --version "$VERSION" --commit "$COMMIT"

      - name: Commit bump to bot branch
        if: steps.bump.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "media-sound/nokkvi/nokkvi-${VERSION}.ebuild"
          git diff --cached --check
          git commit -m "media-sound/nokkvi: bump to ${VERSION}"
          git push origin bot

      - name: Trigger Gentoo manifest workflow
        if: steps.bump.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/workflows/update-nokkvi.yml/dispatches \
            -f ref=bot
