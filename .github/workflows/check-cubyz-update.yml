name: Check cubyz update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: cubyz-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot
          fetch-depth: 0

      - name: Check latest Cubyz release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(gh api repos/PixelGuys/Cubyz/releases/latest \
            | jq -er '.tag_name | select(test("^[0-9]+(\\.[0-9]+)+$"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Detect current versioned ebuild
        id: current
        shell: bash
        run: |
          set -euo pipefail
          file=$(find games-action/cubyz -maxdepth 1 \
            -name 'cubyz-*.ebuild' ! -name 'cubyz-9999.ebuild' \
            | sort -V | tail -1)
          [[ -n "$file" ]] || { echo "::error::No versioned ebuild found"; exit 1; }
          version=${file##*/cubyz-}
          version=${version%.ebuild}
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rename ebuild and commit bump to bot branch
        if: steps.release.outputs.version != steps.current.outputs.version
        env:
          CURRENT_FILE: ${{ steps.current.outputs.file }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git mv "$CURRENT_FILE" "games-action/cubyz/cubyz-${VERSION}.ebuild"
          git commit -m "games-action/cubyz: bump to ${VERSION}"
          git pull --rebase origin bot
          git push origin HEAD:bot

      # Also repair missing/stale manifests when the version is unchanged.
      - name: Trigger Gentoo manifest workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/update-cubyz.yml/dispatches" \
            -f ref=bot
